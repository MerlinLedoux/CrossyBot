<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>CrossyBot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #ui {
      position: fixed;
      top: 16px;
      left: 20px;
      color: white;
      font-family: monospace;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 2px 2px 6px #000;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      bottom: 16px;
      left: 20px;
      color: rgba(255,255,255,0.5);
      font-family: monospace;
      font-size: 13px;
      pointer-events: none;
    }

    #gameover {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-family: monospace;
      text-align: center;
      padding-top: 28vh;
    }
    #gameover h1 { font-size: 72px; color: #ff4040; letter-spacing: 4px; }
    #gameover .final { font-size: 26px; margin-top: 20px; color: #ddd; }
    #gameover .hint  { font-size: 18px; margin-top: 36px; color: #888; }

    #ai-btn {
      position: fixed;
      top: 16px;
      right: 20px;
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      font-family: monospace;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      letter-spacing: 0.5px;
      transition: background 0.2s, border-color 0.2s;
      z-index: 100;
    }
    #ai-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
    #ai-btn.active {
      background: rgba(40, 180, 80, 0.45);
      border-color: rgba(60, 220, 90, 0.8);
    }
    #ai-btn:disabled { opacity: 0.45; cursor: wait; }
  </style>
</head>
<body>
  <div id="ui">Score : <span id="score">0</span></div>
  <button id="ai-btn" disabled>⏳ Chargement…</button>
  <div id="controls">↑ Avancer &nbsp; ↓ Reculer &nbsp; ← → Gauche/Droite &nbsp; R Rejouer</div>

  <div id="gameover">
    <h1>GAME OVER</h1>
    <div class="final" id="final-score">Score final : 0</div>
    <div class="hint">[ R ] pour rejouer</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
